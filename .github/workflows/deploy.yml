env:
  DIRECTORY: .output

name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check Edge API key expiry
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_API_KEY_EXPIRES: '2026-10-11'
        run: |
          if [ -z "$EDGE_API_KEY" ]; then
            echo "::error::EDGE_API_KEY is not configured"
            exit 1
          fi

          TODAY=$(date -u +%F)
          if [[ "$TODAY" > "$EDGE_API_KEY_EXPIRES" || "$TODAY" == "$EDGE_API_KEY_EXPIRES" ]]; then
            echo "::error::EDGE_API_KEY expired on $EDGE_API_KEY_EXPIRES"
            exit 1
          fi

          echo "::notice::EDGE_API_KEY is valid until $EDGE_API_KEY_EXPIRES"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 'latest'
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Zip extensions
        run: |
          pnpm run zip &&
          pnpm run zip:firefox
      # needed since chrome webstore rejected the submission due to "name matches with either prefix or suffix of popular names"
      - name: Patch chrome zip
        run: |
          ./cws-patch.sh "${{ env.DIRECTORY }}/${{ github.event.repository.name }}-${GITHUB_REF_NAME#v}-chrome.zip"
      - name: Upload archives as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extension-zips-${{ github.ref_name }}
          path: |
            ${{ env.DIRECTORY }}/*-chrome.zip
            ${{ env.DIRECTORY }}/*-firefox.zip
            ${{ env.DIRECTORY }}/*-sources.zip
            ${{ env.DIRECTORY }}/*-chrome-patched.zip
      - name: Submit to extension stores
        env:
          CHROME_EXTENSION_ID: bjofjgmleldgbcocnpejlgiklelnohnb
          CHROME_API_VERSION: v2
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_CANCEL_PENDING: true
          CHROME_SKIP_REVIEW: false
          CHROME_SKIP_SUBMIT_REVIEW: false
          FIREFOX_EXTENSION_ID: noimgur-amo@yobson.xyz
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: listed
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_SKIP_SUBMIT_REVIEW: false
        run: |
          pnpm wxt submit \
            --chrome-zip ${{ env.DIRECTORY }}/*-chrome-patched.zip \
            --firefox-zip ${{ env.DIRECTORY }}/*-firefox.zip --firefox-sources-zip ${{ env.DIRECTORY }}/*-sources.zip \
            --edge-zip ${{ env.DIRECTORY }}/*-chrome.zip
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ${{ env.DIRECTORY }}/*-chrome.zip
            ${{ env.DIRECTORY }}/*-firefox.zip
            ${{ env.DIRECTORY }}/*-sources.zip
            ${{ env.DIRECTORY }}/*-chrome-patched.zip
